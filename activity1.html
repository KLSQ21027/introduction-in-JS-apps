<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var choice = prompt("Welcome to area calculator. \n Please enter your choice. \n1.Area of a rectangle. \n2.Area of a triangle. \n3.Area of a circle. \n4.Area of a paralellogram");
        if (choice == '1') {
            var l = prompt("Enter the length")
            var b = prompt("Enter the breadth")
            var result = Number(l) * Number(b)
            alert("The area of the rectangle is " + result)
        }
        if 
        (choice == '2') {
            var h = prompt("Enter the height")
            var b = prompt("Enter the base")
            var result = Number(h) * Number(b) /2
            alert("The area of the triangle is " + result) 
        }
        if (choice == '3') {
            var r = prompt("Enter the radius")
            var result = 3.14*Number(r)*Number(r)
            alert("The area of the circle is " + result)
        }
        if (choice == '4') {
            var h = prompt("Enter the height")
            var cb = prompt("Enter the correspodning base")
            var result = Number(h)*Number(cb)
            alert("The area of the paralellogram is " + result)
        }
    </script>
</body>
</html>
